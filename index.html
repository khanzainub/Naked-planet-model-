<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naked Planet Model | नेकेड प्लैनेट मॉडल</title>
<style>
  :root {
    --bg: #0b0b0c;
    --surface: #151517;
    --surface2: #1c1c1f;
    --border: #2b2b30;
    --border-strong: #3d3d44;
    --text: #f2f2f3;
    --text2: #a4a4ac;
    --amber: #EF9F27;
    --gray: #9a9a96;
    --coral: #F0704A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", "Mangal", Arial, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; }
  header { margin-bottom: 18px; }
  .toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 14px; color: var(--text2); margin: 0; }
  .lang { display: flex; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
  .lang button { background: transparent; color: var(--text2); border: 0; padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .lang button.on { background: var(--text); color: var(--bg); font-weight: 500; }

  .stephead { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  #dots { display: flex; gap: 8px; }
  #dots button {
    width: 30px; height: 30px; border-radius: 50%; padding: 0; font-size: 13px;
    background: var(--surface); color: var(--text2); border: 1px solid var(--border-strong); cursor: pointer; font-family: inherit;
  }
  #dots button.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  #stepno { font-size: 13px; color: var(--text2); }

  .scene { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px 4px 4px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: inherit; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 12px 10px; font-size: 12px; color: var(--text2); }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .fade { transition: opacity .3s; }

  #card { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin: 14px 0; }
  .kicker { font-size: 13px; color: var(--text2); }
  .ctitle { font-size: 17px; font-weight: 500; margin: 2px 0 6px; }
  .ctext { font-size: 14px; line-height: 1.7; color: var(--text); }
  .box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 15px; line-height: 1.8; }
  .box b { font-weight: 500; color: var(--amber); }
  .muted { color: var(--text2); font-size: 13px; }
  .barlabel { font-size: 12px; color: var(--text2); margin: 10px 0 4px; }
  .bartrack { height: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .barfill { height: 100%; border-radius: 5px; }
  .barval { font-size: 13px; margin-top: 3px; }

  .nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
  .nav button {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 12px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .nav button:hover { background: var(--border); }

  .ctl { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
  .ctl label { font-size: 13px; color: var(--text2); min-width: 84px; }
  .ctl input[type=range] { flex: 1; accent-color: var(--amber); }
  .ctl .val { font-size: 14px; font-weight: 500; min-width: 46px; text-align: right; }

  footer { margin-top: 26px; font-size: 12px; color: var(--text2); border-top: 1px solid var(--border); padding-top: 14px; }

  .nav.modes { margin: 0 0 16px; }
  .nav.modes button.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .box sub { font-size: .75em; line-height: 0; }
  .eqr { margin: 0 0 10px; }
  .eqr:last-child { margin: 0; }
  .ok { color: var(--amber); }
  .bad { color: var(--coral); }
  #svg2 line { transition: stroke-width .5s; }
  #svg2 rect { transition: stroke .3s; }
  .hl { paint-order: stroke; stroke: #151517; stroke-width: 3px; stroke-linejoin: round; }
  .nav button:disabled { opacity: .4; cursor: default; }
</style>
</head>

<script>
var sig = 5.67e-8, R = 6.371e6, step = 1, lang = 'hi';
try { var saved = localStorage.getItem('np-lang'); if (saved === 'en' || saved === 'hi') lang = saved; } catch (e) {}

var sup = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function sci(v, d) {
  var dd = (d === undefined) ? 2 : d;
  var e = Math.floor(Math.log10(v));
  var m = v / Math.pow(10, e);
  var s = m.toFixed(dd);
  if (parseFloat(s) >= 10) { m = m / 10; e = e + 1; s = m.toFixed(dd); }
  return s + ' × 10' + String(e).split('').map(function (c) { return sup[c]; }).join('');
}
function r0(x) { return Math.round(x).toString(); }

/* ================= One-layer greenhouse model (Archer) ================= */
var mode = 1, k2 = 0, KMAX = 9, timer = null;
var Iel = document.getElementById('I2'), Rel = document.getElementById('R2');
function g2(id) { return document.getElementById(id); }
function n1(x) { return String(Math.round(x * 10) / 10); }
function Tk(x) { return Math.pow(x / sig, 0.25); }
function fm(s, o) { return s.replace(/\{(\w+)\}/g, function (_, key) { return o[key]; }); }

function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

var TX2 = {

function render2() {
  var L = TX2[lang], on = (mode === 2);
  g2('m1').style.display = on ? 'none' : '';
  g2('m2').style.display = on ? '' : 'none';
  g2('mode1').textContent = L.m1; g2('mode2').textContent = L.m2;
  g2('mode1').className = on ? '' : 'on'; g2('mode2').className = on ? 'on' : '';
  if (!on) return;

  var I = parseFloat(Iel.value), k = k2, eq = (k >= KMAX);
  var g = eq ? 2 * I : 2 * I - I * Math.pow(0.5, k);   /* surface IR emission this round */
  var h = g / 2, rec = I + h;                          /* layer emits h up and h down; surface receives I + h */
  var Tg = Tk(g), Ta = Tk(h), T0 = Tk(I);
  function T(id, s) { g2(id).textContent = s; }

  T('t-title', L.title); T('t-sub', L.sub);
  T('lab-R2', L.labR); T('lab-I2', L.labI); T('I2-out', r0(I));
  Rel.value = k; T('R2-out', eq ? L.eqS : k);

  T('x-space', L.space); T('x-sun', L.sun);
  T('x-atm1', L.atm + ' · Ta = ' + r0(Ta) + ' K');
  T('x-atm2', fm(L.atmLine, { g: r0(g), h: r0(h) }));
  T('x-sf1', L.surf + ' · Tg = ' + r0(Tg) + ' K');
  T('x-sf2', fm(L.sum, { a: r0(I), b: r0(h), c: r0(rec) }));
  T('v-solar', r0(I) + ' W/m²'); T('n-solar', L.nSolar);
  T('v-up', r0(g) + ' W/m²');    T('n-up', L.nUp);
  T('v-esc', r0(h) + ' W/m²');   T('n-esc', L.nEsc);
  T('v-down', r0(h) + ' W/m²');  T('n-down', L.nDown);
  T('l2-sun', L.lsun); T('l2-ir', L.lir); T('l2-atm', L.lat);
  T('ti-solar', L.tipSolar); T('ti-up', L.tipUp); T('ti-esc', L.tipEsc);
  T('ti-down', L.tipDown); T('ti-atm', L.tipAtm); T('ti-surf', L.tipSurf);
  g2('a-solar').setAttribute('stroke-width', wd(I));
  g2('a-up').setAttribute('stroke-width', wd(g));
  g2('a-esc').setAttribute('stroke-width', wd(h));
  g2('a-down').setAttribute('stroke-width', wd(h));
  g2('r-atm').setAttribute('stroke', eq ? '#F0704A' : '#3d3d44');
  g2('r-surf').setAttribute('stroke', eq ? '#F0704A' : '#3d3d44');

  T('b2-prev', L.prev);
  T('b2-next', eq ? L.restart : L.next);
  T('b2-play', timer ? L.pause : L.play);
  T('b2-eq', L.eq);
  g2('b2-prev').disabled = (k === 0);
  g2('b2-eq').disabled = eq;
  T('foot2', L.foot2);
  g2('R2').setAttribute('title', L.tipR); g2('I2').setAttribute('title', L.tipI);
  g2('b2-prev').setAttribute('title', L.tipPrev); g2('b2-next').setAttribute('title', L.tipNext);
  g2('b2-play').setAttribute('title', L.tipPlay); g2('b2-eq').setAttribute('title', L.tipEq);

  /* card */
  var kick = eq ? L.eqW : (k === 0 ? L.start : L.round + ' ' + k);
  var title = eq ? L.teq : (k === 0 ? L.t0 : fm(L.tk, { k: k }));
  var desc = eq ? L.deq : (k === 0 ? L.d0 : L.dk);
  var mk = eq ? ' <span class="ok">✓</span>' : ' <span class="bad">✗</span>';
  var h2 = '<div class="kicker">' + kick + '</div><div class="ctitle">' + title + '</div><div class="ctext">' + desc + '</div>' +
    '<div class="box">' +
    '<div class="eqr"><div class="muted">' + L.e1 + '</div>I<sub>↑,a</sub> + I<sub>↓,a</sub> = I<sub>↑,g</sub><br><b>' + n1(h) + ' + ' + n1(h) + ' = ' + n1(g) + '</b> <span class="ok">✓</span></div>' +
    '<div class="eqr"><div class="muted">' + L.e2 + '</div>2εσT<sub>a</sub>⁴ = εσT<sub>g</sub>⁴<br><b>2 × ' + n1(h) + ' = ' + n1(g) + '</b> <span class="ok">✓</span></div>' +
    '<div class="eqr"><div class="muted">' + L.e3 + '</div>I<sub>↑,g</sub> = I<sub>solar</sub> + I<sub>↓,a</sub><br><b>' + n1(g) + (eq ? ' = ' : ' ≠ ') + n1(I) + ' + ' + n1(h) + ' = ' + n1(rec) + '</b>' + mk + '</div>' +
    '</div>' +
    bar(L.bAbs, 100, '#EF9F27', n1(I), 'W/m²') +
    bar(L.bEsc, Math.min(100, h / I * 100).toFixed(1), '#F0704A', n1(h), 'W/m²') +
    '<div class="muted" style="margin-top:12px">' + fm(L.temps, { a: r0(Tg), b: r0(Ta) }) + '</div>' +
    '<div class="muted" style="margin-top:6px">' + (eq ? L.sEq + ' ' + fm(L.warm, { c: r0(T0), d: r0(Tg - T0) }) : fm(L.sGain, { x: n1(rec - g), y: n1(I - h) })) + '</div>';
  g2('card2').innerHTML = h2;
}

function play2() {
  if (timer) { stopTimer(); render(); return; }
  if (k2 >= KMAX) k2 = 0;
  timer = setInterval(function () {
    if (k2 < KMAX) k2++;
    if (k2 >= KMAX) stopTimer();
    render();
  }, 1300);
  render();
}

g2('mode1').onclick = function () { mode = 1; stopTimer(); render(); };
g2('mode2').onclick = function () { mode = 2; render(); };
g2('b2-prev').onclick = function () { stopTimer(); if (k2 > 0) k2--; render(); };
g2('b2-next').onclick = function () { stopTimer(); k2 = (k2 >= KMAX) ? 0 : k2 + 1; render(); };
g2('b2-play').onclick = play2;
g2('b2-eq').onclick = function () { stopTimer(); k2 = KMAX; render(); };
Rel.addEventListener('input', function () { stopTimer(); k2 = parseInt(Rel.value, 10); render(); });
Iel.addEventListener('input', render);

var Sel = document.getElementById('S'), Ael = document.getElementById('A');

function vals() {
  var S = parseFloat(Sel.value), a = parseFloat(Ael.value);
  var disc = Math.PI * R * R, surf = 4 * disc;
  var Pin = S * disc, Pabs = (1 - a) * Pin, q = Pabs / surf, T = Math.pow(q / sig, 0.25);
  return { S: S, a: a, disc: disc, surf: surf, Pin: Pin, Pabs: Pabs, q: q, T: T };
}

function bar(label, w, col, val, unit) {
  return '<div class="barlabel">' + label + '</div>' +
    '<div class="bartrack"><div class="barfill" style="width:' + w + '%;background:' + col + '"></div></div>' +
    '<div class="barval">' + val + ' ' + (unit || 'W') + '</div>';
}

function head(L, n) {
  return '<div class="kicker">' + L.stepWord + ' ' + n + '</div><div class="ctitle">' + L['t' + n] + '</div><div class="ctext">' + L['d' + n] + '</div>';
}

function card(v) {
  var L = TX[lang], h = '';
  if (step === 1) {
    h = head(L, 1) + '<div class="box">' + L.f1 + '<br>= ' + r0(v.S) + ' × ' + sci(v.disc) + '<br><b>= ' + sci(v.Pin) + ' W</b></div>';
  } else if (step === 2) {
    h = head(L, 2) + '<div class="box">' + L.f2 + '<br>= ' + (1 - v.a).toFixed(2) + ' × ' + sci(v.Pin) + '<br><b>= ' + sci(v.Pabs) + ' W</b></div>';
  } else if (step === 3) {
    h = head(L, 3) + '<div class="box">' + L.f3 + '<br>4πr² = ' + sci(v.surf) + ' m²<br><span class="muted">' + L.n3 + '</span></div>';
  } else if (step === 4) {
    h = head(L, 4) +
      '<div class="box">(1 − α) × S × <s>πr²</s> = σT⁴ × 4 × <s>πr²</s><br><b>σT⁴ = (1 − α) × S ÷ 4 = ' + r0(v.q) + ' W/m²</b></div>' +
      bar(L.b1, 100, '#EF9F27', sci(v.Pabs)) + bar(L.b2, 100, '#F0704A', sci(v.Pabs));
  } else {
    var d = v.T - 288;
    var msg = (d < 0 ? L.cold : L.warm).replace('{x}', r0(Math.abs(d)));
    h = head(L, 5) +
      '<div class="box">σT⁴ = ' + r0(v.q) + ' W/m²<br>T⁴ = ' + r0(v.q) + ' ÷ (5.67 × 10⁻⁸) = ' + sci(v.q / sig) + '<br>T = ' + L.root + '<br><b>T = ' + r0(v.T) + ' K = ' + r0(v.T - 273.15) + ' °C</b></div>' +
      '<div class="muted" style="margin-top:12px">' + msg + '</div>';
  }
  document.getElementById('card').innerHTML = h;
}

function scene() {
  var op = { 1: [1, 1, 0, 0], 2: [1, 0.4, 1, 0], 3: [0.25, 0, 0, 1], 4: [0.6, 0.6, 0.6, 0.6], 5: [0.35, 0, 0.3, 1] }[step];
  document.getElementById('rays').style.opacity = op[0];
  document.getElementById('disc').style.opacity = op[1];
  document.getElementById('refl').style.opacity = op[2];
  document.getElementById('ir').style.opacity = op[3];
  document.getElementById('planet').setAttribute('stroke', step === 5 ? '#F0704A' : '#3d3d44');
  var a = parseFloat(Ael.value), w = (1.5 + a * 7).toFixed(1);
  document.getElementById('r1').setAttribute('stroke-width', w);
  document.getElementById('r2').setAttribute('stroke-width', w);
}

function buildDots() {
  var L = TX[lang], el = document.getElementById('dots');
  el.innerHTML = '';
  for (var i = 1; i <= 5; i++) {
    (function (i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', L.stepWord + ' ' + i);
      b.textContent = i;
      if (i === step) b.className = 'on';
      b.onclick = function () { step = i; render(); };
      el.appendChild(b);
    })(i);
  }
  document.getElementById('stepno').textContent = L.stepWord + ' ' + step + ' ' + L.of + ' 5';
}

function labels() {
  var L = TX[lang];
  document.documentElement.setAttribute('lang', lang);
  document.title = 'Naked Planet Model | नेकेड प्लैनेट मॉडल';
  document.getElementById('t-title').textContent = L.title;
  document.getElementById('t-sub').textContent = L.sub;
  document.getElementById('s-sun').textContent = L.sun;
  document.getElementById('s-disc').textContent = L.disc;
  document.getElementById('s-refl').textContent = L.refl;
  document.getElementById('s-surf1').textContent = L.surf;
  document.getElementById('l-sun').textContent = L.lsun;
  document.getElementById('l-refl').textContent = L.lrefl;
  document.getElementById('l-ir').textContent = L.lir;
  document.getElementById('prev').textContent = L.prev;
  document.getElementById('next').textContent = (step === 5) ? L.restart : L.next;
  document.getElementById('lab-S').textContent = L.labS;
  document.getElementById('lab-A').textContent = L.labA;
  document.getElementById('foot').textContent = L.foot;
  document.getElementById('b-hi').className = (lang === 'hi') ? 'on' : '';
  document.getElementById('b-en').className = (lang === 'en') ? 'on' : '';
}

function render() {
  var v = vals();
  document.getElementById('S-out').textContent = r0(v.S);
  document.getElementById('A-out').textContent = v.a.toFixed(2);
  labels(); card(v); scene(); buildDots();
  render2();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('np-lang', l); } catch (e) {}
  render();
}

document.getElementById('b-hi').onclick = function () { setLang('hi'); };
document.getElementById('b-en').onclick = function () { setLang('en'); };
document.getElementById('prev').onclick = function () { if (step > 1) { step--; render(); } };
document.getElementById('next').onclick = function () { step = (step === 5) ? 1 : step + 1; render(); };
Sel.addEventListener('input', render);
Ael.addEventListener('input', render);
render();
</script>
</body>
